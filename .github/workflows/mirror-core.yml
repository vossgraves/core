name: Mirror core upstream

# Merges rukamori/core main onto the Metrolist fork lineage and opens a PR to
# 4nx3b/core, so the app's core submodule pin can always resolve on 4nx3b/core.
#
# TOPOLOGY
# --------
# - rukamori/core main: upstream innertube library.
# - 4nx3b/core main: the Metrolist fork the app's submodule points at
#   (mhsm/MetrolistExtractor playback stack, captions, regionSpoofer, VL guard).
# - This repo (vossgraves/core) is the direct parent of 4nx3b/core: it carries
#   the same Metrolist commits and is where the merged result is staged.
#
# This workflow MERGES upstream into the Metrolist lineage (never replaces the
# tree) because the fork carries commits that must survive: mhsm ports, the
# removed network gatekeeper, metrolist.extractor dependency.
#
# The merged branch is pushed to this repo and a PR to 4nx3b/core is opened or
# updated. When 4nx3b merges it, the app's core pin moves forward; nothing
# ever points at this repo from the app's submodule URL.

on:
  schedule:
    - cron: '13 */2 * * *'
  workflow_dispatch:

concurrency:
  group: mirror-core
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM: rukamori/core
  UPSTREAM_URL: https://github.com/rukamori/core.git
  FORK: 4nx3b/core
  FORK_URL: https://github.com/4nx3b/core.git
  PR_BRANCH: metrolist-upstream-sync

jobs:
  mirror:
    name: Merge rukamori/core into fork lineage
    runs-on: ubuntu-latest
    steps:
      - name: Require SYNC_PAT
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          if [ -z "${SYNC_PAT:-}" ]; then
            echo "::error::SYNC_PAT is not set. The merge is pushed and the PR to"
            echo "${FORK} is opened with it; GITHUB_TOKEN cannot write to ${FORK}."
            exit 1
          fi
          echo "SYNC_PAT present."

      - name: Checkout this fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.SYNC_PAT }}

      - name: Fetch upstream and the fork head
        run: |
          set -euo pipefail
          git remote add up "${UPSTREAM_URL}" 2>/dev/null || git remote set-url up "${UPSTREAM_URL}"
          git remote add fork "${FORK_URL}" 2>/dev/null || git remote set-url fork "${FORK_URL}"
          git fetch --no-tags up "refs/heads/main:refs/up/main"
          git fetch --no-tags fork "refs/heads/main:refs/fork/main"
          echo "upstream: $(git rev-parse --short refs/up/main)"
          echo "fork:     $(git rev-parse --short refs/fork/main)"

      - name: Build the merged branch
        run: |
          set -euo pipefail

          # Merge commits need an author; the runner has no git identity.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Start from the fork head so the Metrolist lineage (and any commits
          # 4nx3b pushed since) is the base, then merge upstream on top.
          git checkout -B "${PR_BRANCH}" refs/fork/main

          # First merge the fork's own tip into the branch: if the previous PR
          # was merged on 4nx3b's side, refs/fork/main already contains our
          # earlier merge commit, and this is a no-op. If 4nx3b committed on
          # top, the branch catches up.
          git merge --no-ff -q refs/fork/main -m "merge: sync fork head" 2>/dev/null || true

          # Now bring in upstream. Everything after this is assertable: the
          # Metrolist markers must survive the merge, and the network
          # gatekeeper (removed from the fork on purpose) must not come back.
          git merge --no-edit -q refs/up/main \
            -m "merge(upstream): rukamori/core main at $(git rev-parse --short refs/up/main)"

          echo "Merged branch: $(git rev-parse --short HEAD)"

      - name: Assert fork markers survived
        run: |
          set -euo pipefail

          # Conflict markers left behind would be an unbuildable tree; the
          # merge fails loudly before any push.
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.md' | head; then
            echo "::error::Conflict markers found after merge -- refusing to push."
            exit 1
          fi

          # The network gatekeeper was removed from the fork deliberately
          # (remote validation of client signatures is a booby trap). Upstream
          # still ships it; it must not resurface.
          if git ls-files | grep -q NetworkGatekeeper; then
            echo "::error::NetworkGatekeeper.kt is present in the merged tree --"
            echo "upstream must have reintroduced it. Refusing to push."
            exit 1
          fi
          echo "NetworkGatekeeper.kt absent (good)."

          # The Metrolist playback stack is the point of the fork; losing the
          # dependency would silently revert the app to upstream's player.
          if ! git grep -q 'libs.metrolist.extractor' -- build.gradle.kts; then
            echo "::error::libs.metrolist.extractor missing from build.gradle.kts"
            echo "after the merge -- the fork's playback stack was lost."
            exit 1
          fi
          echo "metrolist.extractor present (good)."

      - name: Push merged branch
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail
          git push --force origin "HEAD:refs/heads/${PR_BRANCH}"
          echo "Pushed ${PR_BRANCH} = $(git rev-parse --short HEAD)"

      - name: Open or update PR to 4nx3b/core
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail
          TITLE="merge(upstream): rukamori/core main"
          BODY="Automated sync of rukamori/core main onto the Metrolist fork lineage.
          Staged here (vossgraves/core:${PR_BRANCH}) by the mirror workflow; merging
          keeps the app's core submodule pin resolvable on 4nx3b/core."

          # gh pr create fails loudly ("No commits between base and head") when
          # the merged branch is identical to the fork's main -- e.g. the
          # previous sync PR was already merged and upstream hasn't moved
          # since. That's a legitimate "nothing to sync" outcome, not a
          # failure, so check for it before ever calling `gh pr create`.
          AHEAD="$(git rev-list --count refs/fork/main..HEAD)"
          if [ "${AHEAD}" -eq 0 ]; then
            echo "No commits between ${FORK}:main and ${PR_BRANCH} -- nothing to sync, skipping PR."
            exit 0
          fi

          if ! gh pr list --repo "${FORK}" --head "${GITHUB_REPOSITORY_OWNER}:${PR_BRANCH}" \
              --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create --repo "${FORK}" \
              --base main \
              --head "${GITHUB_REPOSITORY_OWNER}:${PR_BRANCH}" \
              --title "${TITLE}" --body "${BODY}"
            echo "Opened PR."
          else
            gh pr edit --repo "${FORK}" \
              --title "${TITLE}" --body "${BODY}"
            echo "Updated existing PR."
          fi
